
  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sucursales</title>
    <link rel="stylesheet" href="../estilos/sucursales.css">
</head>
<body>

<div class="contenedor">
    <div class="lista-sucursales">
        <h2>Sucursales</h2>

        <ul>
            <li onclick="mostrarMapa('1.215392,-77.280212', '../imagenes/centro.png', 'Sucursal Centro')">Sucursal Centro</li>
            <li onclick="mostrarMapa('1.216349,-77.288129', '../imagenes/unicentro.png', 'Sucursal Unicentro')">Sucursal Unicentro</li>
            <li onclick="mostrarMapa('1.228832,-77.282883', '../imagenes/avenida los estudiantes.png', 'Sucursal Avenida los Estudiantes')">Sucursal Avenida los Estudiantes</li>
            <li onclick="mostrarMapa('1.204038,-77.278010', '../imagenes/americas.png', 'Sucursal Las Américas')">Sucursal Las Américas</li>
        </ul>
    </div>

    <div class="mapa-contenedor">
        <h3 id="tituloMapa">Selecciona una sucursal</h3>

        <img id="imagenSucursal" src="" class="imagen-oculta">

        <iframe id="mapaGoogle"
            width="100%"
            height="350"
            style="border:0"
            loading="lazy">
        </iframe>
    </div>
</div>

<script>
    function mostrarMapa(coords, imagenRuta, nombreSucursal) {
        const mapa = document.getElementById("mapaGoogle");
        const imagenSucursal = document.getElementById("imagenSucursal");
        const titulo = document.getElementById("tituloMapa");

        mapa.src = "https://www.google.com/maps?q=" + coords + "&output=embed";

        imagenSucursal.src = imagenRuta;
        imagenSucursal.classList.remove("imagen-oculta");

        titulo.textContent = nombreSucursal;
    }
</script>

</body>
</html>
